const BASE_URL="https://firestore.googleapis.com/v1/projects/"+PROJECT_ID+"/databases/(default)/documents";
const toFS=(obj)=>{const fields={};for(const[k,v]of Object.entries(obj)){if(v===undefined||v===null)fields[k]={nullValue:null};else if(typeof v==="boolean")fields[k]={booleanValue:v};else if(typeof v==="number"){if(Number.isInteger(v))fields[k]={integerValue:String(v)};else fields[k]={doubleValue:v};}else fields[k]={stringValue:String(v)};}return{fields};};
const fromFS=(doc)=>{const id=doc.name.split("/").pop();const obj={id};for(const[k,v]of Object.entries(doc.fields||{})){if(v.stringValue!==undefined)obj[k]=v.stringValue;else if(v.integerValue!==undefined)obj[k]=Number(v.integerValue);else if(v.doubleValue!==undefined)obj[k]=Number(v.doubleValue);else if(v.booleanValue!==undefined)obj[k]=v.booleanValue;else obj[k]=null;}return obj;};
const hdr={"Content-Type":"application/json"};
const fsGet=async(col)=>{const r=await fetch(BASE_URL+"/"+col,{headers:hdr});const d=await r.json();return(d.documents||[]).map(fromFS);};
const fsAdd=async(col,data)=>{const r=await fetch(BASE_URL+"/"+col,{method:"POST",headers:hdr,body:JSON.stringify(toFS(data))});return fromFS(await r.json());};
const fsSet=async(col,id,data)=>{const mask=Object.keys(data).map(k=>"updateMask.fieldPaths="+encodeURIComponent(k)).join("&");await fetch(BASE_URL+"/"+col+"/"+id+"?"+mask,{method:"PATCH",headers:hdr,body:JSON.stringify(toFS(data))});};
const fsDel=async(col,id)=>{await fetch(BASE_URL+"/"+col+"/"+id,{method:"DELETE",headers:hdr});};
const fsGetDoc=async(col,id)=>{const r=await fetch(BASE_URL+"/"+col+"/"+id,{headers:hdr});if(!r.ok)return null;const d=await r.json();return d.fields?fromFS(d):null;};
const fsSetDoc=async(col,id,data)=>{await fetch(BASE_URL+"/"+col+"/"+id,{method:"PATCH",headers:hdr,body:JSON.stringify(toFS(data))});};

// ★ NumberInput: 小数点入力で値を置き換え
function NumberInput({value,onChange,min=0,max=999,label}){
  const isDecimal=typeof value==="number"&&!Number.isInteger(value);
  const[free,setFree]=useState(()=>isDecimal||value>30);
  const[strVal,setStrVal]=useState(()=>String(value));
  const decOpts=[];for(let i=1;i<=100;i++)decOpts.push(Math.round(i*0.1*10)/10);
  const intOpts=Array.from({length:31},(_,i)=>i);
  const enterFree=()=>{setFree(true);setStrVal(String(value));};
  const exitFree=()=>{setFree(false);if(typeof value==="number"&&(value>30||!Number.isInteger(value)))onChange(0);};
  const handleStrChange=e=>{const raw=e.target.value;setStrVal(raw);const n=parseFloat(raw);if(!isNaN(n)&&n>=min&&n<=max)onChange(n);};
  const handleStrBlur=()=>{const n=parseFloat(strVal);if(isNaN(n)||n<min){setStrVal(String(min));onChange(min);}else if(n>max){setStrVal(String(max));onChange(max);}else{const f=Math.round(n*10)/10;setStrVal(String(f));onChange(f);}};
  useEffect(()=>{setStrVal(String(value));},[value]);
  return(
    <div>
      {label&&<label style={{fontSize:13,color:"#666",display:"block",marginBottom:4}}>{label}</label>}
      <div style={{display:"flex",gap:0,alignItems:"stretch",borderRadius:8,overflow:"hidden",border:"1px solid #ddd"}}>
        <div style={{flex:1,borderRight:"1px solid #ddd"}}>
          {!free
            ?<select value={Number.isInteger(value)&&value>=0&&value<=30?value:"__free"}
                onChange={e=>{if(e.target.value==="__free")enterFree();else onChange(Number(e.target.value));}}
                style={{...iSt,border:"none",borderRadius:0,width:"100%",height:"100%"}}>
              <option value="__free">自由入力...</option>
              {intOpts.map(n=><option key={n} value={n}>{n}</option>)}
            </select>
            :<div style={{display:"flex",height:"100%"}}>
              <input type="text" inputMode="decimal" value={strVal} onChange={handleStrChange} onBlur={handleStrBlur}
                style={{...iSt,border:"none",borderRadius:0,flex:1,minWidth:0}}/>
              <button onClick={exitFree} style={{...bSm,background:"#f5f5f5",color:"#555",fontSize:11,padding:"0 8px",borderRadius:0,borderLeft:"1px solid #ddd",whiteSpace:"nowrap"}}>戻す</button>
            </div>
          }
        </div>
        <div style={{flex:1}}>
          {/* ★ 小数点入力: 値を置き換え */}
          <select value="" onChange={e=>{
            const dec=parseFloat(e.target.value);if(isNaN(dec))return;
            onChange(dec);setStrVal(String(dec));if(!free)setFree(true);
          }} style={{...iSt,border:"none",borderRadius:0,width:"100%",height:"100%",color:"#2e7d32",background:"#f1f8e9",fontSize:13}}>
            <option value="">小数点入力</option>
            {decOpts.map(d=><option key={d} value={d}>{d}</option>)}
          </select>
        </div>
      </div>
    </div>
  );
}

function SortControl({sortKey,sortDir,onChange}){
  const opts=[
    {k:"none",label:"並び替えなし"},
    {k:"name_asc",label:"あいうえお順 ↑"},{k:"name_desc",label:"あいうえお順 ↓"},
    {k:"qty_asc",label:"個数 少ない順 ↑"},{k:"qty_desc",label:"個数 多い順 ↓"},
    {k:"date_asc",label:"登録日 古い順 ↑"},{k:"date_desc",label:"登録日 新しい順 ↓"},
    {k:"expiry_asc",label:"賞味期限 近い順 ↑"},{k:"expiry_desc",label:"賞味期限 遠い順 ↓"},
    {k:"memo_asc",label:"メモあり優先"},
  ];
  const[open,setOpen]=useState(false);const ref=useRef();
  useEffect(()=>{const h=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);};document.addEventListener("mousedown",h);return()=>document.removeEventListener("mousedown",h);},[]);
  const parseKey=(k)=>{if(k==="none")return["none",""];const pts=k.split("_");const d=pts.pop();return[pts.join("_"),d];};
  const curOpt=opts.find(o=>{if(o.k==="none")return sortKey==="none";const[k,d]=parseKey(o.k);return sortKey===k&&sortDir===d;});
  return(
    <div ref={ref} style={{position:"relative"}}>
      <button onClick={()=>setOpen(o=>!o)} style={{...bSm,background:"#fff",color:"#555",border:"1px solid #ddd",display:"flex",alignItems:"center",gap:4,padding:"7px 12px"}}><SortIcon/>{curOpt?curOpt.label:"並び替え"}</button>
      {open&&<div style={{position:"absolute",top:"110%",right:0,background:"#fff",borderRadius:10,boxShadow:"0 4px 16px rgba(0,0,0,0.15)",zIndex:300,whiteSpace:"nowrap",overflow:"hidden",minWidth:220}}>
        {opts.map(o=>{const[k,d]=parseKey(o.k);const active=sortKey===k&&(k==="none"||sortDir===d);return<button key={o.k} onClick={()=>{onChange(k,d);setOpen(false);}} style={{display:"block",width:"100%",padding:"12px 16px",background:active?"#e8f5e9":"#fff",border:"none",borderBottom:"1px solid #f0f0f0",cursor:"pointer",fontSize:12,textAlign:"left",color:active?"#2e7d32":"#222",fontWeight:active?"bold":"normal"}}>{o.label}</button>;})}
      </div>}
    </div>
  );
}

function applySortItems(arr,sk,sd){
  if(sk==="none")return arr;
  return[...arr].sort((a,b)=>{
    if(sk==="name"){const r=a.name.localeCompare(b.name,"ja");return sd==="asc"?r:-r;}
    if(sk==="qty")return sd==="asc"?a.qty-b.qty:b.qty-a.qty;
    if(sk==="date"){const da=a.createdAt||"",db=b.createdAt||"";return sd==="asc"?da.localeCompare(db):db.localeCompare(da);}
    if(sk==="expiry"){const ea=a.expiry||"",eb=b.expiry||"";if(!ea&&!eb)return 0;if(!ea)return 1;if(!eb)return -1;return sd==="asc"?ea.localeCompare(eb):eb.localeCompare(ea);}
    if(sk==="memo")return(b.note?1:0)-(a.note?1:0);
    return 0;
  });
}
function applySortGrouped(arr,sk,sd){
  if(sk==="none")return arr;
  return[...arr].sort((a,b)=>{
    if(sk==="name"){const r=a.name.localeCompare(b.name,"ja");return sd==="asc"?r:-r;}
    if(sk==="qty"){const qa=Object.values(a.locs).reduce((s,v)=>s+v,0),qb=Object.values(b.locs).reduce((s,v)=>s+v,0);return sd==="asc"?qa-qb:qb-qa;}
    if(sk==="date"){const da=a.createdAt||"",db=b.createdAt||"";return sd==="asc"?da.localeCompare(db):db.localeCompare(da);}
    if(sk==="expiry"){const ea=a.expiry||"",eb=b.expiry||"";if(!ea&&!eb)return 0;if(!ea)return 1;if(!eb)return -1;return sd==="asc"?ea.localeCompare(eb):eb.localeCompare(ea);}
    if(sk==="memo")return(b.note?1:0)-(a.note?1:0);
    return 0;
  });
}

function DraggableList({items,renderItem,onReorder,keyFn}){
  const[drag,setDrag]=useState(null);const[over,setOver]=useState(null);
  const end=()=>{if(drag!==null&&over!==null&&drag!==over){const a=[...items];const[x]=a.splice(drag,1);a.splice(over,0,x);onReorder(a);}setDrag(null);setOver(null);};
  return<div>{items.map((item,i)=><div key={keyFn(item,i)} draggable onDragStart={()=>setDrag(i)} onDragEnter={()=>setOver(i)} onDragEnd={end} onDragOver={e=>e.preventDefault()} style={{opacity:over===i&&drag!==i?0.5:1,transition:"opacity .15s"}}>{renderItem(item,i)}</div>)}</div>;
}

function CalendarPicker({value,onChange,onClose}){

  const{year,month}=view;const first=new Date(year,month,1).getDay(),days=new Date(year,month+1,0).getDate();
  const cells=[];for(let i=0;i<first;i++)cells.push(null);for(let d=1;d<=days;d++)cells.push(d);
  const mn=["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
  const pick=d=>{onChange(year+"-"+String(month+1).padStart(2,"0")+"-"+String(d).padStart(2,"0"));onClose();};
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.4)",zIndex:3000,display:"flex",alignItems:"center",justifyContent:"center"}} onClick={e=>{e.stopPropagation();onClose();}}>

          <button style={{...bSm,padding:"8px 14px"}} onClick={()=>setView(v=>({year:v.month===0?v.year-1:v.year,month:v.month===0?11:v.month-1}))}>‹</button>
          <b>{year}年 {mn[month]}</b>
          <button style={{...bSm,padding:"8px 14px"}} onClick={()=>setView(v=>({year:v.month===11?v.year+1:v.year,month:v.month===11?0:v.month+1}))}>›</button>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,textAlign:"center"}}>
          {["日","月","火","水","木","金","土"].map(d=><div key={d} style={{fontSize:12,color:"#888",fontWeight:"bold",padding:"4px 0"}}>{d}</div>)}
          {cells.map((d,i)=>{const s=d?year+"-"+String(month+1).padStart(2,"0")+"-"+String(d).padStart(2,"0"):"";const sel=d&&value===s;return<div key={i} onClick={d?()=>pick(d):undefined} style={{padding:"8px 0",borderRadius:8,cursor:d?"pointer":"default",background:sel?"#4CAF50":"transparent",color:sel?"#fff":"#333",fontWeight:"bold",fontSize:14}}>{d||""}</div>;})}
        </div>
        <button onClick={onClose} style={{marginTop:12,width:"100%",padding:"10px",background:"#eee",border:"none",borderRadius:8,cursor:"pointer",fontSize:14}}>閉じる</button>
      </div>
    </div>
  );
}

function ItemForm({initial,onSave,onCancel,prefill,extraLocations,defaultLocation,expiryRules,onGoHome,onAddToShop}){
  const allLoc=[...LOCATIONS,...(extraLocations||[]).filter(l=>!LOCATIONS.includes(l)&&!SHOP_NAMES.includes(l))];
  const initForm=()=>{
    if(initial){
      const loc=SHOP_NAMES.includes(initial.location)?"冷蔵室":initial.location;
      // 編集時: 既存の購入日をYYYY-MM-DDで初期表示
      const purchaseDate=tsToDate(initial.createdAt)||"";
      return{...initial,location:loc,purchaseDate};
    }
    const defLoc=(prefill&&prefill.location&&!SHOP_NAMES.includes(prefill.location))?prefill.location:(defaultLocation||"冷蔵室");
    return{name:(prefill&&prefill.name)||"",detail:"",category:(prefill&&prefill.category)||"",qty:1,location:defLoc,expiry:(prefill&&prefill.expiry)||"",note:"",yomi:"",purchaseDate:""};
  };
  const[form,setForm]=useState(initForm);
  const[showCal,setShowCal]=useState(false);
  const[showPurchaseCal,setShowPurchaseCal]=useState(false);
  const[autoMsg,setAutoMsg]=useState("");

  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  const showYomiWarn=hasKanji(form.name)&&!(form.yomi||"").trim();
  const applyAE=(name)=>{if(!name){setAutoMsg("");return null;}const res=autoExpiry(name,expiryRules||[]);if(res){setAutoMsg("「"+res.ruleName+"」ルールと一致しました。");return res.expiry;}setAutoMsg("");return null;};
  const clearExpiry=()=>{set("expiry","");setAutoMsg("");setExpiryManuallyCleared(true);};
  const onCatChange=(cat)=>{setExpiryManuallyCleared(false);const ae=applyAE(cat||"");setForm(f=>({...f,category:cat,name:cat||"",detail:"",expiry:ae||""}));};
  const onDetailChange=(val)=>{setExpiryManuallyCleared(false);const newName=val||form.category||"";const ae=applyAE(newName);setForm(f=>({...f,detail:val,name:newName,expiry:ae!=null?ae:f.expiry}));};
  const onNameChange=(v)=>{setExpiryManuallyCleared(false);const ae=applyAE(v);setForm(f=>({...f,name:v,expiry:ae!=null?ae:f.expiry}));};
  const detOpts=form.category?(CATEGORY_DETAILS[form.category]||[]):[];
  const handleSave=()=>{if(!form.name||!form.name.trim()){alert("商品名を入力してください");return;}onSave([{...form,id:form.id||genId(),_expiryCleared:expiryManuallyCleared}]);};
  const iconBtn={width:34,height:34,display:"flex",alignItems:"center",justifyContent:"center",border:"none",borderRadius:8,cursor:"pointer",flexShrink:0};
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.4)",zIndex:500,display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{background:"#fff",borderRadius:16,padding:24,width:340,maxHeight:"92vh",overflowY:"auto",boxShadow:"0 8px 32px rgba(0,0,0,0.2)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
          <h3 style={{margin:0,color:"#2e7d32"}}>{!initial?"新規登録":"編集"}</h3>
          <div style={{display:"flex",gap:6,alignItems:"center"}}>
            <button onClick={()=>{if(!form.name)return;if(onAddToShop)onAddToShop(form.name);}} title="買い物に追加" style={{...iconBtn,background:"#fff8e1",color:"#f57f17"}}><CartIcon/></button>
            {onGoHome&&<button onClick={onGoHome} style={{...bSm,background:"#e8f5e9",color:"#2e7d32",display:"flex",alignItems:"center",gap:4,padding:"8px 12px"}}><HomeIcon/> ホーム</button>}
          </div>
        </div>
        {autoMsg&&!expiryManuallyCleared&&<div style={{background:"#e8f5e9",borderRadius:8,padding:"8px 12px",marginBottom:10,fontSize:12,color:"#2e7d32"}}>🕐 {autoMsg}</div>}
        <div style={{marginBottom:10}}><label style={{fontSize:13,color:"#666"}}>種類</label><select value={form.category} onChange={e=>onCatChange(e.target.value)} style={iSt}><option value="">選択してください（任意）</option>{CATEGORIES.map(c=><option key={c} value={c}>{c}</option>)}</select></div>
        <div style={{marginBottom:10}}><label style={{fontSize:13,color:"#666"}}>詳細</label>{detOpts.length>0?<select value={form.detail} onChange={e=>onDetailChange(e.target.value)} style={iSt}><option value="">選択または直接入力</option>{detOpts.map(d=><option key={d} value={d}>{d}</option>)}</select>:<input value={form.detail} onChange={e=>onDetailChange(e.target.value)} placeholder="自由入力" style={iSt}/>}</div>
        <div style={{marginBottom:10}}><label style={{fontSize:13,color:"#666"}}>商品</label><input value={form.name} onChange={e=>onNameChange(e.target.value)} placeholder="商品名を入力" style={iSt}/></div>
        <div style={{marginBottom:10}}><NumberInput value={form.qty} onChange={v=>set("qty",v)} min={0} max={999} label="個数"/></div>
        <div style={{marginBottom:10}}><label style={{fontSize:13,color:"#666"}}>保存場所</label><select value={form.location} onChange={e=>set("location",e.target.value)} style={iSt}>{allLoc.map(l=><option key={l} value={l}>{l}</option>)}</select></div>
        <div style={{marginBottom:10}}><label style={{fontSize:13,color:"#666"}}>賞味期限</label>
          <div style={{display:"flex",gap:8,alignItems:"center"}}><input value={form.expiry} readOnly placeholder="タップして選択" onClick={()=>setShowCal(true)} style={{...iSt,cursor:"pointer",flex:1}}/>{form.expiry&&<button onClick={clearExpiry} style={{...bSm,background:"#ffebee",color:"#c62828",fontSize:14,padding:"8px 10px"}}>✕</button>}</div>
          {expiryManuallyCleared&&<div style={{fontSize:11,color:"#e65100",marginTop:4}}>※ 賞味期限なしで保存します</div>}
        </div>
        {/* ★ 購入日: 新規・編集どちらも表示。プレースホルダーから「未設定=今日」を削除 */}
        <div style={{marginBottom:14}}>
          <div style={{display:"flex",alignItems:"baseline",gap:8,marginBottom:4}}>
            <label style={{fontSize:13,color:"#666",whiteSpace:"nowrap"}}>購入日</label>
            <span style={{fontSize:11,color:"#aaa"}}>変更する場合に設定してください</span>
          </div>
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            <input value={form.purchaseDate||""} readOnly placeholder="タップして選択" onClick={()=>setShowPurchaseCal(true)} style={{...iSt,cursor:"pointer",flex:1,fontSize:13}}/>
            {form.purchaseDate&&<button onClick={()=>set("purchaseDate","")} style={{...bSm,background:"#ffebee",color:"#c62828",fontSize:14,padding:"8px 10px"}}>✕</button>}
          </div>
        </div>
        <div style={{marginBottom:14}}><label style={{fontSize:13,color:"#666"}}>メモ</label><input value={form.note} onChange={e=>set("note",e.target.value)} style={iSt}/></div>
        <div style={{marginBottom:14}}>
          <div style={{display:"flex",alignItems:"baseline",gap:8,marginBottom:4}}>
            <label style={{fontSize:13,color:"#666",whiteSpace:"nowrap"}}>よみがな</label>
            <span style={{fontSize:11,color:"#aaa"}}>漢字で登録する場合は入力してください</span>
          </div>
          {showYomiWarn&&<div style={{background:"#fff3e0",borderRadius:6,padding:"6px 10px",marginBottom:6,fontSize:12,color:"#e65100"}}>⚠️ 検索範囲に漢字を含む場合はよみがなを入力してください。</div>}
          <input value={form.yomi||""} onChange={e=>set("yomi",e.target.value)} placeholder="例: とうふ、なっとう" style={{...iSt,borderColor:showYomiWarn?"#ffb74d":"#ddd"}}/>
        </div>
        <div style={{display:"flex",gap:8}}>
          <button onClick={handleSave} style={{flex:1,padding:"12px",background:"#4CAF50",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontWeight:"bold",fontSize:15}}>保存</button>
          <button onClick={onCancel} style={{flex:1,padding:"12px",background:"#eee",border:"none",borderRadius:8,cursor:"pointer",fontSize:15}}>キャンセル</button>
        </div>
      </div>
      {showCal&&<CalendarPicker value={form.expiry} onChange={v=>{set("expiry",v);setExpiryManuallyCleared(false);}} onClose={()=>setShowCal(false)}/>}
      {showPurchaseCal&&<CalendarPicker value={form.purchaseDate||""} onChange={v=>set("purchaseDate",v)} onClose={()=>setShowPurchaseCal(false)}/>}
    </div>
  );
}

function BarcodeModal({onClose,onFound}){
  const[bc,setBc]=useState("");const[loading,setLoading]=useState(false);const[result,setResult]=useState(null);const[err,setErr]=useState("");
  const[cameraActive,setCameraActive]=useState(false);const[cameraErr,setCameraErr]=useState("");
  const videoRef=useRef();const streamRef=useRef(null);const scanRef=useRef(null);const inputRef=useRef();
  useEffect(()=>{setTimeout(()=>inputRef.current&&inputRef.current.focus(),100);return()=>stopCamera();},[]);
  const stopCamera=()=>{if(scanRef.current){clearInterval(scanRef.current);scanRef.current=null;}if(streamRef.current){streamRef.current.getTracks().forEach(t=>t.stop());streamRef.current=null;}setCameraActive(false);};
  const startCamera=async()=>{setCameraErr("");setErr("");setResult(null);try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}});streamRef.current=stream;setCameraActive(true);setTimeout(async()=>{if(videoRef.current){videoRef.current.srcObject=stream;try{await videoRef.current.play();}catch{}}if(window.BarcodeDetector){const detector=new window.BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","code_128","code_39","qr_code"]});scanRef.current=setInterval(async()=>{if(!videoRef.current)return;try{const b=await detector.detect(videoRef.current);if(b.length>0){const val=b[0].rawValue;stopCamera();setBc(val);await doLookup(val);}}catch{}},400);}else{setCameraErr("このブラウザはバーコード自動検出に対応していません。");}},200);}catch{setCameraErr("カメラを起動できませんでした。");setCameraActive(false);}};
  const doLookup=async(code)=>{const val=(code||bc).trim();if(!val)return;setLoading(true);setErr("");setResult(null);const gc=(name)=>{const l=(name||"").toLowerCase();if(l.includes("milk")||l.includes("牛乳"))return"牛乳";if(l.includes("beef")||l.includes("pork")||l.includes("chicken")||l.includes("meat"))return"肉類";if(l.includes("fish")||l.includes("salmon")||l.includes("tuna"))return"魚類";if(l.includes("egg"))return"卵";if(l.includes("yogurt")||l.includes("cheese")||l.includes("butter"))return"乳製品";if(l.includes("juice")||l.includes("cola")||l.includes("coffee")||l.includes("tea")||l.includes("beer")||l.includes("water"))return"飲み物";if(l.includes("frozen"))return"冷凍食品";if(l.includes("bread")||l.includes("rice")||l.includes("pasta"))return"パン・穀物";if(l.includes("chip")||l.includes("chocolate")||l.includes("candy")||l.includes("cookie"))return"お菓子";if(l.includes("sauce")||l.includes("oil")||l.includes("salt")||l.includes("sugar"))return"調味料";return"その他";};
    try{const r1=await fetch("https://world.openfoodfacts.org/api/v0/product/"+val+".json");const d1=await r1.json();if(d1.status===1&&d1.product){const p=d1.product;const name=p.product_name_ja||p.product_name||p.product_name_en||"";if(name){setResult({name,category:gc(name)});setLoading(false);return;}}}catch{}
    try{const r2=await fetch("https://api.upcitemdb.com/prod/trial/lookup?upc="+val);const d2=await r2.json();if(d2.items&&d2.items.length>0){const name=d2.items[0].title||"";setResult({name,category:gc(name)});setLoading(false);return;}}catch{}
    setErr("このバーコードはデータベースに登録されていませんでした。");setResult({name:"",category:""});setLoading(false);};
  return(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:600,display:"flex",alignItems:"center",justifyContent:"center"}}><div style={{background:"#fff",borderRadius:16,padding:24,width:340,maxHeight:"88vh",overflowY:"auto",boxShadow:"0 8px 32px rgba(0,0,0,0.2)"}}>
    <h3 style={{margin:"0 0 14px",color:"#2e7d32"}}>📦 バーコード読み取り</h3>
    {cameraActive&&<div style={{marginBottom:12}}><video ref={videoRef} style={{width:"100%",borderRadius:10,background:"#000",maxHeight:220,objectFit:"cover",display:"block"}} muted playsInline/>{cameraErr?<div style={{background:"#fff3e0",borderRadius:8,padding:10,marginTop:8,fontSize:13,color:"#e65100"}}>{cameraErr}</div>:<div style={{textAlign:"center",fontSize:13,color:"#2e7d32",marginTop:6,fontWeight:"bold"}}>📷 バーコードをカメラに向けてください</div>}<button onClick={stopCamera} style={{width:"100%",padding:"10px",background:"#eee",border:"none",borderRadius:8,cursor:"pointer",marginTop:8,fontSize:14,fontWeight:"bold"}}>カメラを閉じる</button></div>}
    {!cameraActive&&<button onClick={startCamera} style={{width:"100%",padding:"13px",background:"#e8f5e9",border:"2px solid #4CAF50",borderRadius:8,cursor:"pointer",fontWeight:"bold",marginBottom:14,color:"#2e7d32",fontSize:14}}>📷 カメラでバーコードを読み取る</button>}
    <div style={{background:"#f5f5f5",borderRadius:8,padding:8,marginBottom:10,fontSize:12,color:"#777",textAlign:"center"}}>または番号を手入力して検索</div>
    <div style={{display:"flex",gap:8,marginBottom:12}}><input ref={inputRef} value={bc} onChange={e=>setBc(e.target.value)} onKeyDown={e=>e.key==="Enter"&&doLookup()} placeholder="例: 4901301270009" style={{...iSt,flex:1}}/><button onClick={()=>doLookup()} disabled={loading} style={{...bSm,background:"#4CAF50",color:"#fff",padding:"10px 14px",fontSize:14}}>検索</button></div>
    {loading&&<div style={{textAlign:"center",padding:16,color:"#666"}}>🔍 検索中...</div>}
    {err&&<div style={{background:"#fff3e0",borderRadius:8,padding:12,marginBottom:12,fontSize:13,color:"#e65100"}}>{err}</div>}
    {result&&<div style={{background:"#f5f5f5",borderRadius:8,padding:12,marginBottom:12}}><div style={{fontSize:14,fontWeight:"bold",marginBottom:4}}>{result.name?"✅ "+result.name:"商品名が見つかりませんでした"}</div><button onClick={()=>{onFound(result);onClose();}} style={{marginTop:8,width:"100%",padding:"12px",background:"#4CAF50",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontWeight:"bold",fontSize:14}}>この商品を登録画面へ</button></div>}
    <button onClick={()=>{stopCamera();onClose();}} style={{width:"100%",padding:"10px",background:"#eee",border:"none",borderRadius:8,cursor:"pointer",fontSize:14}}>閉じる</button>
  </div></div>);
}

function parseCSV(text){
  text=text.replace(/^\uFEFF/,"").replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  const lines=[];let cur="";let inQ=false;
  for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(inQ&&text[i+1]==='"'){cur+='"';i++;}else{inQ=!inQ;}}else if(c==="\n"&&!inQ){lines.push(cur);cur="";}else{cur+=c;}}
  if(cur.trim())lines.push(cur);
  const rows=lines.map(line=>{const cells=[];let cell="";let inq=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){if(inq&&line[i+1]==='"'){cell+='"';i++;}else{inq=!inq;}}else if(c===","&&!inq){cells.push(cell);cell="";}else{cell+=c;}}cells.push(cell);return cells;});
  if(rows.length<2)return[];const headers=rows[0].map(h=>h.trim());
  return rows.slice(1).filter(r=>r.some(c=>c.trim())).map(r=>{const obj={};headers.forEach((h,i)=>obj[h]=(r[i]||"").trim());return{id:genId(),name:obj["商品名"]||"",detail:"",category:obj["種類"]||"",qty:parseFloat(obj["個数"])||1,location:obj["場所"]||"冷蔵室",expiry:obj["賞味期限"]||"",note:obj["メモ"]||""};}).filter(i=>i.name);
}

  </div>);

function MemoCard({memo,onEdit,onDelete}){

  return(<div style={{background:"#fff",borderRadius:12,padding:"12px 14px",marginBottom:8,boxShadow:"0 2px 8px rgba(0,0,0,0.07)",borderLeft:"4px solid #4CAF50",borderTop:"1px solid #eee",borderRight:"1px solid #eee",borderBottom:"1px solid #eee"}}>
    <div style={{display:"flex",alignItems:"flex-start",gap:6}}>
      <span style={{paddingTop:3,cursor:"grab",color:"#ccc",flexShrink:0}}><DragHandle/></span>
      <div style={{flex:1,minWidth:0}}><div style={{fontSize:11,color:"#aaa",marginBottom:4}}>{memo.date}</div>{editing?<><textarea ref={taRef} value={editText} onChange={e=>{setEditText(e.target.value);ar(e.target);}} rows={3} style={{...iSt,resize:"none",fontFamily:"inherit",minHeight:60,overflow:"hidden",marginBottom:6,fontSize:13}}/><div style={{display:"flex",gap:6}}><button onClick={save} style={{...bSm,background:"#4CAF50",color:"#fff",padding:"7px 14px"}}>保存</button><button onClick={()=>{setEditing(false);setEditText(memo.text);}} style={{...bSm,background:"#eee",padding:"7px 12px"}}>キャンセル</button></div></>:<div style={{fontSize:14,color:"#333",whiteSpace:"pre-wrap",wordBreak:"break-word"}}>{memo.text}</div>}</div>
      {!editing&&<div style={{display:"flex",gap:3,flexShrink:0}}><button onClick={()=>setEditing(true)} style={{...bSm,background:"#e3f2fd",color:"#1565c0",display:"flex",alignItems:"center",padding:"7px 8px"}}><EditIcon/></button><button onClick={()=>{if(window.confirm("削除しますか？"))onDelete(memo.id);}} style={{...bSm,background:"#ffebee",color:"#c62828",display:"flex",alignItems:"center",padding:"7px 8px"}}><TrashIcon/></button></div>}
    </div>
  </div>);

function MemoTab({memos,onAdd,onEdit,onDelete,onReorder}){

    <div style={{marginBottom:14}}><textarea ref={taRef} value={text} onChange={e=>{setText(e.target.value);ar(e.target);}} placeholder="メモを入力..." rows={3} style={{...iSt,resize:"none",fontFamily:"inherit",minHeight:72,overflow:"hidden",marginBottom:8}}/><button onClick={()=>{if(!text.trim())return;onAdd(text.trim());setText("");}} style={{width:"100%",padding:"11px",background:"#4CAF50",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontWeight:"bold",fontSize:14}}>＋ 追加</button></div>

function App(){
  const[items,setItems]=useState([]);
  const[loading,setLoading]=useState(true);
  const[tabOrder,setTabOrder]=useState([...DEFAULT_TABS]);

  const[fridgeTab,setFridgeTab]=useState("冷蔵室");
  const[showForm,setShowForm]=useState(false);
  const[editItem,setEditItem]=useState(null);
  const[showReceipt,setShowReceipt]=useState(false);
  const[showBarcode,setShowBarcode]=useState(false);
  const[barcodePrefill,setBarcodePrefill]=useState(null);
  const[showSettings,setShowSettings]=useState(false);
  const[search,setSearch]=useState("");
  const[shopList,setShopList]=useState([]);
  const[memos,setMemos]=useState([]);
  const[memoLastSeen,setMemoLastSeen]=useState("");
  const[showReflect,setShowReflect]=useState(false);
  const[pendingDone,setPendingDone]=useState([]);
  const[sortStates,setSortStates]=useState({});
  const[expiryRules,setExpiryRules]=useState(DEFAULT_EXPIRY_RULES);
  const[hiddenTabs,setHiddenTabs]=useState([]);
  const[qtyModal,setQtyModal]=useState(null);
  const[qtyZeroModal,setQtyZeroModal]=useState(null);
  const[updateLogsState,setUpdateLogsState]=useState([]);
  const[syncIndicator,setSyncIndicator]=useState(false);

  const settingsReady=useRef(false);
  const isEditingShop=useRef(false);
  const tabOrderRef=useRef([...DEFAULT_TABS]);
  const shopListRef=useRef([]);
  const hiddenTabsRef=useRef([]);
  const expiryRulesRef=useRef(DEFAULT_EXPIRY_RULES);
  const tabChildrenRef=useRef({});

  // ★ 子タブになっているタブはトップレベルには表示しない
  const allChildTabs=Object.values(tabChildren||{}).flat();
  const visibleTabs=tabOrder.filter(t=>!hiddenTabs.includes(t)&&!allChildTabs.includes(t));

  const getSortState=(t)=>sortStates[t]||{sortKey:"none",sortDir:"asc"};
  const setSortState=(t,k,d)=>setSortStates(prev=>({...prev,[t]:{sortKey:k,sortDir:d}}));
  const fileRef=useRef();
  // ★ タブドラッグ: トップレベルタブ用
  const tabDrag=useRef(null);const[tabDragOver,setTabDragOver]=useState(null);
  const customTabs=tabOrder.filter(t=>!DEFAULT_TABS.includes(t));

  // ★ 現在アクティブな実際のタブ（親タブが選ばれていれば子タブの選択を反映）
  const getDefaultLocation=()=>{
    const at=activeTab;
    if(at==="冷蔵庫")return fridgeTab;
    if(LOCATIONS.includes(at)||customTabs.includes(at))return at;
    return"冷蔵室";
  };

  const fetchItems=useCallback(async()=>{try{const data=await fsGet("items");if(data)setItems(data);}catch(e){console.error(e);}},[]);
  const fetchMemos=useCallback(async()=>{try{const data=await fsGet("memos");if(data)setMemos(data.sort((a,b)=>b.ts>a.ts?1:-1));}catch(e){console.error(e);}},[]);

  const saveMainSettings=useCallback(async(overrides={})=>{
    if(!settingsReady.current)return;
    const to=overrides.tabOrder||tabOrderRef.current;
    const sl=overrides.shopList||shopListRef.current;
    const ht=overrides.hiddenTabs||hiddenTabsRef.current;
    const er=overrides.expiryRules||expiryRulesRef.current;
    const tc=overrides.tabChildren||tabChildrenRef.current;
    try{await fsSetDoc("settings","main",{tabOrderJson:JSON.stringify(to),shopListJson:JSON.stringify(sl),hiddenTabsJson:JSON.stringify(ht),expiryRulesJson:JSON.stringify(er),tabChildrenJson:JSON.stringify(tc)});}catch(e){console.error(e);}
  },[]);

  const saveUpdateLogsFS=useCallback(async(logs)=>{
    setUpdateLogsState(logs);
    try{await fsSetDoc("settings","updateLogs",{dataJson:JSON.stringify(logs)});}catch(e){console.error(e);}
  },[]);

  const fetchSettings=useCallback(async()=>{
    try{
      const s=await fsGetDoc("settings","main");
      if(s){
        if(s.tabOrderJson){try{const raw=JSON.parse(s.tabOrderJson);const t=migrateTabOrder(raw);setTabOrder(t);tabOrderRef.current=t;}catch{}}
        if(s.shopListJson){try{const sl=JSON.parse(s.shopListJson);if(Array.isArray(sl)){setShopList(sl);shopListRef.current=sl;}}catch{}}
        if(s.hiddenTabsJson){try{const h=JSON.parse(s.hiddenTabsJson);if(Array.isArray(h)){const hm=h.map(x=>x==="買い物リスト"?"買い物":x);setHiddenTabs(hm);hiddenTabsRef.current=hm;}}catch{}}
        if(s.expiryRulesJson){try{const r=JSON.parse(s.expiryRulesJson);if(Array.isArray(r)&&r.length>0){setExpiryRules(r);expiryRulesRef.current=r;}}catch{}}
        if(s.tabChildrenJson){try{const tc=JSON.parse(s.tabChildrenJson);if(tc&&typeof tc==="object"){setTabChildren(tc);tabChildrenRef.current=tc;}}catch{}}
        if(s.memoLastSeen)setMemoLastSeen(s.memoLastSeen);
      }
    }catch(e){console.error(e);}
    try{const ul=await fsGetDoc("settings","updateLogs");if(ul&&ul.dataJson){try{const d=JSON.parse(ul.dataJson);if(Array.isArray(d))setUpdateLogsState(d);}catch{}}}catch{}
    settingsReady.current=true;
  },[]);

  useEffect(()=>{
    (async()=>{await Promise.all([fetchItems(),fetchSettings(),fetchMemos()]);setLoading(false);})();
    const onFocus=()=>{fetchItems();fetchMemos();};
    window.addEventListener("focus",onFocus);
    return()=>window.removeEventListener("focus",onFocus);
  },[]);

  const updateShopList=useCallback((newList)=>{
    const list=typeof newList==="function"?newList(shopListRef.current):newList;
    shopListRef.current=list;setShopList(list);
    if(settingsReady.current)saveMainSettings({shopList:list});
  },[saveMainSettings]);

  const updateTabOrder=useCallback((newOrder)=>{tabOrderRef.current=newOrder;setTabOrder(newOrder);if(settingsReady.current)saveMainSettings({tabOrder:newOrder});},[saveMainSettings]);
  const saveHiddenTabs=useCallback((arr)=>{hiddenTabsRef.current=arr;setHiddenTabs(arr);if(settingsReady.current)saveMainSettings({hiddenTabs:arr});},[saveMainSettings]);
  const saveExpiryRules=useCallback((rules)=>{expiryRulesRef.current=rules;setExpiryRules(rules);if(settingsReady.current)saveMainSettings({expiryRules:rules});},[saveMainSettings]);

  // ★ タブ結合保存
  const saveTabChildren=useCallback((parent,children)=>{
    const newTc={...tabChildrenRef.current,[parent]:children};
    tabChildrenRef.current=newTc;setTabChildren(newTc);
    if(settingsReady.current)saveMainSettings({tabChildren:newTc});
  },[saveMainSettings]);

  const saveMemoLastSeen=useCallback(async(ts)=>{setMemoLastSeen(ts);if(!settingsReady.current)return;try{await fsSet("settings","main",{memoLastSeen:ts});}catch{}},[]);
  useEffect(()=>{if(tab==="メモ")saveMemoLastSeen(nowTs());},[tab]);

  const pollShopAndMemos=useCallback(async()=>{
    if(!settingsReady.current)return;
    try{

  const getAutoExpiry=(name)=>{const res=autoExpiry(name,expiryRulesRef.current);return res?res.expiry:"";};
  const buildCreatedAt=(purchaseDate)=>{if(purchaseDate)return purchaseDate+"T00:00:00.000Z";return nowTs();};

  const addItems=async(arr)=>{
    for(const item of arr){
      const{id:_,_expiryCleared,purchaseDate,...data}=item;
      if(!_expiryCleared&&!data.expiry){const ae=getAutoExpiry(data.name);if(ae)data.expiry=ae;}

    }
    setShowForm(false);setBarcodePrefill(null);
  };

  const saveEdit=async(arr)=>{
    const main=arr[0];const{id,_expiryCleared,purchaseDate,...data}=main;
    if(!_expiryCleared&&!data.expiry){const ae=getAutoExpiry(data.name);if(ae)data.expiry=ae;}
    // ★ 購入日が設定されていれば上書き、空なら既存を維持
    if(purchaseDate){data.createdAt=buildCreatedAt(purchaseDate);}else if(!data.createdAt){data.createdAt=nowTs();}

    for(const extra of arr.slice(1)){
      const{id:_,_expiryCleared:ec,purchaseDate:pd,...edata}=extra;

      edata.createdAt=buildCreatedAt(pd);
      const added=await fsAdd("items",edata);
      setItems(prev=>[...prev,{...edata,id:added.id}]);
    }
    setEditItem(null);
  };

  const deleteItem=async(id)=>{if(!window.confirm("削除しますか？"))return;await fsDel("items",id);setItems(prev=>prev.filter(i=>i.id!==id));};

  const addToShop=useCallback((itemOrName,silent=false)=>{

    if(shopListRef.current.some(s=>s.name===name)){if(!silent)alert("「"+name+"」はすでに買い物にあります");return;}
    const newList=[...shopListRef.current,{id:genId(),name,qty:1,done:false}];

  useEffect(()=>{window._addToShopExternal=name=>{if(!shopListRef.current.some(s=>s.name===name)){updateShopList([...shopListRef.current,{id:genId(),name,qty:1,done:false}]);}};},[updateShopList]);

  const doChangeQty=async(item,delta,updateDate)=>{
    const newQty=Math.max(0,Math.round((item.qty+delta)*10)/10);
    let newExpiry=item.expiry;
    if(delta>0&&!item.expiry){const ae=getAutoExpiry(item.name);if(ae)newExpiry=ae;}
    const patch={qty:newQty};
    if(updateDate&&delta>0)patch.createdAt=nowTs();
    if(newExpiry!==item.expiry)patch.expiry=newExpiry;
    setItems(prev=>prev.map(i=>i.id===item.id?{...i,...patch,expiry:newExpiry}:i));
    await fsSet("items",item.id,patch).catch(e=>console.error(e));
    if(newQty===0&&item.qty>0)setQtyZeroModal({itemName:item.name});
  };

    await doChangeQty(item,delta,false);
  };

      else{const data={name:s.name,detail:"",category:m[0]?m[0].category||"":"",qty:bq,location:"冷蔵室",expiry:ae||"",note:"",createdAt:nowTs()};try{const added=await fsAdd("items",data);setItems(prev=>[...prev,{...data,id:added.id}]);}catch(e){console.error(e);}}

  const exportCSV=()=>{
    const h="商品名,種類,個数,場所,賞味期限,メモ";
    const rows=items.map(i=>'"'+i.name.replace(/"/g,'""')+'","'+(i.category||"").replace(/"/g,'""')+'",'+i.qty+',"'+(i.location||"").replace(/"/g,'""')+'","'+(i.expiry||"")+'","'+(i.note||"").replace(/"/g,'""')+'"');
    const blob=new Blob(["\uFEFF",[h,...rows].join("\r\n")],{type:"text/csv;charset=utf-8"});
    const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="食料品リスト.csv";document.body.appendChild(a);a.click();setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},100);
  };

  const handleCSVImport=e=>{
    const f=e.target.files[0];if(!f)return;
    const tryRead=(enc)=>new Promise((res,rej)=>{const r=new FileReader();r.onload=ev=>res(ev.target.result);r.onerror=rej;r.readAsText(f,enc);});
    (async()=>{
      const raw=await new Promise((res,rej)=>{const r=new FileReader();r.onload=ev=>res(ev.target.result);r.onerror=rej;r.readAsArrayBuffer(f);});
      const bytes=new Uint8Array(raw);const isUtf8Bom=bytes[0]===0xEF&&bytes[1]===0xBB&&bytes[2]===0xBF;
      const enc=isUtf8Bom?"utf-8":"shift-jis";let text=await tryRead(enc);
      if(!isUtf8Bom&&/[\ufffd]/.test(text))text=await tryRead("utf-8");
      const parsed=parseCSV(text);
      if(parsed.length===0){alert("インポートできる行がありませんでした。");return;}
      if(!window.confirm(parsed.length+"件インポートします。既存データに追加されます。よろしいですか？"))return;
      let ok=0;
      for(const item of parsed){try{const{id:_,...data}=item;data.createdAt=nowTs();const added=await fsAdd("items",data);setItems(prev=>[...prev,{...data,id:added.id}]);ok++;}catch(e){console.error(e);}}
      alert(ok+"件インポートしました。");
    })();
    e.target.value="";
  };

  // ★ タブコンテンツのレンダリング（activeTabを使用）
  const renderTabContent=(currentTab)=>{
    if(currentTab==="メモ")return<MemoTab memos={memos} onAdd={addMemo} onEdit={editMemo} onDelete={deleteMemo} onReorder={setMemos}/>;

                  </div>}
                </div>
              </div>
            </div>);
          }}/>
      </div>);

        <div style={{display:"flex",gap:6,marginBottom:8}}>
          {["冷蔵室","野菜室","冷凍庫"].map(t=><button key={t} onClick={()=>setFridgeTab(t)} style={{flex:1,padding:"10px 6px",background:fridgeTab===t?"#4CAF50":"#fff",color:fridgeTab===t?"#fff":"#333",border:"none",borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:"bold"}}>

            <button onClick={()=>updateShopList(shopListRef.current.map(i=>i.id===s.id?{...i,qty:Math.max(1,(i.qty||1)-1)}:i))} style={{...sBtn,background:"#f5f5f5",color:"#666"}}>－</button>
            <span style={{width:36,height:36,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:"bold",fontSize:14,color:s.done?"#aaa":"#222",flexShrink:0}}>{s.qty||1}</span>
            <button onClick={()=>updateShopList(shopListRef.current.map(i=>i.id===s.id?{...i,qty:(i.qty||1)+1}:i))} style={{...sBtn,background:"#f5f5f5",color:"#666"}}>＋</button>
            <button onClick={()=>updateShopList(shopListRef.current.filter(i=>i.id!==s.id))} style={{...sBtn,background:"#ffebee",color:"#c62828"}}><TrashIcon/></button>
          </div>);}}/>
        <button onClick={()=>updateShopList([...shopListRef.current,{id:genId(),name:"",qty:1,done:false}])} style={{width:"100%",padding:"12px",background:"#e8f5e9",border:"2px dashed #4CAF50",borderRadius:8,cursor:"pointer",color:"#2e7d32",fontWeight:"bold",marginTop:4,fontSize:14}}>＋ 追加</button>
        {shopList.some(s=>s.done)&&<>
          <button onClick={handleDeleteDone} style={{width:"100%",padding:"10px",background:"#ffebee",border:"none",borderRadius:8,cursor:"pointer",color:"#c62828",marginTop:8,fontWeight:"bold",fontSize:14}}>完了済みを削除</button>
          <div style={{fontSize:11,color:"#aaa",textAlign:"center",marginTop:4}}>完了済みを削除を押すと☑している買い物が在庫リストに反映されます</div>
        </>}
      </div>
    );

    // カスタムタブ
    const{sortKey:sk,sortDir:sd}=getSortState(currentTab);
    const locItems=applySortItems(byLoc(currentTab),sk,sd);
    return(
      <div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <h4 style={{margin:0,color:"#2e7d32"}}>{currentTab} ({byLoc(currentTab).length}件)</h4>
          <SortControl sortKey={sk} sortDir={sd} onChange={(k,d)=>setSortState(currentTab,k,d)}/>
        </div>
        {locItems.length===0&&<div style={{textAlign:"center",color:"#999",padding:24}}>データなし<br/><span style={{fontSize:12}}>「＋ 追加」から保存場所「{currentTab}」を選んで登録できます</span></div>}
        <DraggableList items={locItems} keyFn={i=>i.id} onReorder={ni=>reorderByLoc(currentTab,ni)} renderItem={i=><ItemCard item={i} onEdit={setEditItem} onDelete={deleteItem} onQtyChange={changeQty} onAddToShop={addToShop}/>}/>
      </div>
    );
  };

  const shopCount=shopList.filter(s=>!s.done&&s.name).length;
  const goHome=()=>{setShowForm(false);setEditItem(null);setShowSettings(false);setShowBarcode(false);setShowReceipt(false);};

  // ★ 子タブの表示ロジック
  const curChildren=tabChildren[tab]||[];
  const curSubTab=subTab[tab]!==undefined?subTab[tab]:"";
  // 表示するタブ: 子タブ選択中ならその子タブ、それ以外は親タブ自身
  const activeTab=(curChildren.length>0&&curSubTab&&curChildren.includes(curSubTab))?curSubTab:tab;

  // サブタブドラッグ
  const subDrag=useRef(null);const[subDragOver,setSubDragOver]=useState(null);
  const handleSubDragEnd=(parentTab)=>{
    if(subDrag.current!==null&&subDragOver!==null&&subDrag.current!==subDragOver){
      const arr=[...(tabChildren[parentTab]||[])];
      const[item]=arr.splice(subDrag.current,1);
      arr.splice(subDragOver,0,item);
      saveTabChildren(parentTab,arr);
    }
    subDrag.current=null;setSubDragOver(null);
  };

  return(<div style={{maxWidth:480,margin:"0 auto",background:"#f0f7f0",minHeight:"100vh",fontFamily:"'Hiragino Sans','Meiryo',sans-serif"}}>
    <div style={{background:"linear-gradient(135deg,#2e7d32,#4CAF50)",padding:"12px 14px 0",color:"#fff"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
        <h2 style={{margin:0,fontSize:16,whiteSpace:"nowrap",letterSpacing:"-0.3px"}}>🏠 食料品管理</h2>
        <div style={{display:"flex",gap:4,alignItems:"center",flexShrink:0}}>
          <button onClick={()=>setShowForm(true)} style={{...bSm,background:"#fff",color:"#2e7d32",padding:"8px 10px",whiteSpace:"nowrap"}}>＋ 追加</button>
          <ReadingMenuButton onBarcode={()=>setShowBarcode(true)} onReceipt={()=>setShowReceipt(true)}/>
          <button onClick={()=>setShowSettings(true)} style={{...bSm,background:"rgba(255,255,255,0.2)",color:"#fff",padding:"8px 10px",whiteSpace:"nowrap"}}>⚙️ 設定</button>
        </div>
      </div>
      {/* ★ トップレベルタブ（ドラッグ移動可） */}
      <div style={{display:"flex",gap:1,overflowX:"auto"}}>
        {visibleTabs.map(t=>{
          const oi=tabOrder.indexOf(t);let label=t;
          if(t==="賞味期限"&&expiryItems.length>0)label=t+" ("+expiryItems.length+")";
          if(t==="買い物"&&shopCount>0)label=t+" ("+shopCount+")";
          if(t==="メモ"&&unreadMemoCount>0)label=t+" ("+unreadMemoCount+")";
          return(<div key={t}
            draggable
            onDragStart={()=>{tabDrag.current=oi;}}
            onDragEnter={()=>setTabDragOver(oi)}
            onDragEnd={handleTabDragEnd}
            onDragOver={e=>e.preventDefault()}
            onClick={()=>setTab(t)}
            style={{padding:"8px 9px",background:tab===t?"#fff":(tabDragOver===oi&&tabDrag.current!==oi?"rgba(255,255,255,0.3)":"transparent"),color:tab===t?"#2e7d32":"rgba(255,255,255,0.85)",borderRadius:"8px 8px 0 0",cursor:"pointer",fontSize:11,fontWeight:"bold",whiteSpace:"nowrap",userSelect:"none",transition:"background .15s"}}>{label}</div>);
        })}
      </div>
      {/* ★ 子タブバー: 親タブ自身 + 子タブ（どちらもドラッグ可） */}
      {curChildren.length>0&&<div style={{background:"rgba(0,0,0,0.15)",display:"flex",gap:1,overflowX:"auto",padding:"4px 0 0"}}>
        {/* 親タブ自身 */}
        <div
          onClick={()=>setSubTab(prev=>({...prev,[tab]:""}))}
          style={{padding:"6px 10px",background:activeTab===tab?"rgba(255,255,255,0.9)":"transparent",color:activeTab===tab?"#2e7d32":"rgba(255,255,255,0.8)",borderRadius:"6px 6px 0 0",cursor:"pointer",fontSize:11,fontWeight:"bold",whiteSpace:"nowrap",userSelect:"none"}}>
          {tab}
        </div>
        {/* 子タブ（ドラッグ可） */}
        {curChildren.map((c,ci)=>(
          <div key={c}
            draggable
            onDragStart={e=>{e.stopPropagation();subDrag.current=ci;}}
            onDragEnter={e=>{e.stopPropagation();setSubDragOver(ci);}}
            onDragEnd={e=>{e.stopPropagation();handleSubDragEnd(tab);}}
            onDragOver={e=>{e.preventDefault();e.stopPropagation();}}
            onClick={()=>setSubTab(prev=>({...prev,[tab]:c}))}
            style={{padding:"6px 10px",background:activeTab===c?"rgba(255,255,255,0.9)":"transparent",color:activeTab===c?"#2e7d32":"rgba(255,255,255,0.8)",borderRadius:"6px 6px 0 0",cursor:"pointer",fontSize:11,fontWeight:"bold",whiteSpace:"nowrap",userSelect:"none",opacity:subDragOver===ci&&subDrag.current!==ci?0.5:1,transition:"opacity .15s"}}>
            {c}
          </div>
        ))}
      </div>}
    </div>
    <div style={{padding:12}}>
      {loading&&<div style={{textAlign:"center",padding:32,color:"#888"}}>🔄 データを読み込み中...</div>}
      {!loading&&<>
        {activeTab!=="買い物"&&activeTab!=="メモ"&&<div style={{marginBottom:12}}><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 検索..." style={iSt}/></div>}
        {renderTabContent(activeTab)}
      </>}
    </div>
    {showForm&&<ItemForm onSave={addItems} onCancel={()=>{setShowForm(false);setBarcodePrefill(null);}} prefill={barcodePrefill} defaultLocation={getDefaultLocation()} extraLocations={customTabs} expiryRules={expiryRules} onGoHome={goHome} onAddToShop={handleAddToShopFromForm}/>}
    {editItem&&<ItemForm initial={editItem} onSave={saveEdit} onCancel={()=>setEditItem(null)} extraLocations={customTabs} expiryRules={expiryRules} onGoHome={goHome} onAddToShop={handleAddToShopFromForm}/>}
    {showReceipt&&<ReceiptModal onClose={()=>setShowReceipt(false)} onAdd={addItems}/>}
    {showBarcode&&<BarcodeModal onClose={()=>setShowBarcode(false)} onFound={r=>{setBarcodePrefill(r);setShowBarcode(false);setShowForm(true);}}/>}
    {showSettings&&<SettingsModal tabOrder={tabOrder} hiddenTabs={hiddenTabs} onSaveHiddenTabs={saveHiddenTabs} onClose={()=>{setShowSettings(false);if(hiddenTabs.includes(tab))setTab(visibleTabs[0]||DEFAULT_TABS[0]);}} onRenameTab={n=>{updateTabOrder(n);if(!n.includes(tab))setTab(n[0]);}} onExport={exportCSV} onImportClick={()=>fileRef.current.click()} onAddTab={addTab} onRemoveTab={removeTab} expiryRules={expiryRules} onSaveExpiryRules={saveExpiryRules} updateLogs={updateLogsState} onSaveUpdateLogs={saveUpdateLogsFS} tabChildren={tabChildren} onSaveTabChildren={saveTabChildren}/>}
    {qtyModal&&<QtyAddModal item={qtyModal.item} onUpdateDate={handleQtyUpdateDate} onNewEntry={handleQtyNewEntry} onCancel={()=>setQtyModal(null)}/>}
    {qtyZeroModal&&<QtyZeroModal itemName={qtyZeroModal.itemName} onYes={()=>{addToShop(qtyZeroModal.itemName,true);setQtyZeroModal(null);}} onNo={()=>setQtyZeroModal(null)}/>}
    {showReflect&&<ShopReflectModal doneItems={pendingDone} onOverwrite={doReflectOverwrite} onOverwriteNew={doReflectOverwriteNew} onNewAll={doReflectNew} onCancel={doReflectCancel}/>}
    <input ref={fileRef} type="file" accept=".csv" onChange={handleCSVImport} style={{display:"none"}}/>
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
